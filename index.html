<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dialog Prestasi Matematik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE dashboard sekolah maya: mesra, kemas, untuk dibentang dalam dialog prestasi
   IDEA papan pemuka sekolah: bar sisi navigasi, kad putih bucu bulat di atas latar ungu lembut
   PICTURE kad sambutan indigo dengan papan kapur ilustrasi; bar bertindan TP/gred; donat kategori
   COLOUR latar #f4f2fc, kad putih, indigo #5b4fe9; Lemah #f2603f, Sederhana #ffc24b, Cemerlang #5b4fe9
   TYPE Poppins 600/700 tajuk, Poppins 400 teks
   LAYOUT bar sisi 250px + kandungan grid kad; telefon: nav mendatar di atas, kad satu lajur */
:root{color-scheme:light dark;--bg:light-dark(#f4f2fc,#14121f);--card:light-dark(#ffffff,#1e1b2e);--ink:light-dark(#1c1a33,#ecebf5);--mut:light-dark(#77738f,#a6a2bf);--line:light-dark(#ebe8f5,#2c2842);--soft:light-dark(#f0eefb,#262238);--pri:#5b4fe9;--pri2:light-dark(#5b4fe9,#9a92ff);--L:#f2603f;--S:#ffc24b;--C:#5b4fe9;--side:light-dark(#ffffff,#1a1729)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Poppins,system-ui,sans-serif;display:grid;grid-template-columns:250px minmax(0,1fr);overflow-x:clip}
button,select{font:inherit;color:inherit}
aside{background:var(--side);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:6px;height:100vh;position:sticky;top:0;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;line-height:1.2;padding:0 8px 18px}
.logo i{width:40px;height:40px;border-radius:12px;background:var(--pri);color:#fff;display:grid;place-items:center;font-style:normal;font-size:20px;flex:none}
.logo small{display:block;font-weight:500;font-size:12px;color:var(--mut)}
.nh{font-size:12px;color:var(--mut);font-weight:600;padding:14px 10px 4px}
.nv{display:flex;align-items:center;gap:12px;border:0;background:none;text-align:left;padding:9px 12px;border-radius:12px;cursor:pointer;color:var(--mut);font-weight:500;min-height:42px}
.nv svg{width:20px;height:20px;flex:none}
.nv:hover{background:var(--soft);color:var(--ink)}
.nv.on{background:var(--pri);color:#fff;box-shadow:0 6px 16px -6px var(--pri)}
.nv .dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none;margin:0 6px}
main{padding:24px clamp(16px,3vw,36px) 40px;display:flex;flex-direction:column;gap:22px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font-size:26px;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em}
.top .sub{color:var(--mut);font-size:14px}
.top .sp{flex:1}
.chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 16px;font-size:13px;font-weight:600;white-space:nowrap}
.ib{border:1px solid var(--line);background:var(--card);border-radius:12px;min-width:44px;height:44px;cursor:pointer;font-weight:600;padding:0 14px}
.ib:hover{border-color:var(--pri)}
.ib:focus-visible,.nv:focus-visible,.cl:focus-visible{outline:3px solid var(--pri2);outline-offset:2px}
.grid{display:grid;gap:20px;grid-template-columns:repeat(12,minmax(0,1fr))}
.card{background:var(--card);border-radius:20px;padding:22px;box-shadow:0 1px 2px rgba(30,20,90,.04),0 8px 24px -12px rgba(30,20,90,.12)}
.card h3{margin:0 0 4px;font-size:17px;font-weight:600}
.card .cap{color:var(--mut);font-size:13px;margin:0 0 16px}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}.s3{grid-column:span 3}
.hero{background:var(--pri);color:#fff;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:center;gap:20px;padding:28px 32px;overflow:hidden;position:relative}
.hero h2{font-size:clamp(24px,2.6vw,36px);line-height:1.1;margin:6px 0 10px;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
.hero p{margin:0;opacity:.88;max-width:520px}
.hero .k{font-size:13px;opacity:.8}
.hero svg{width:100%;max-height:210px}
.stat{display:flex;align-items:center;gap:14px}
.stat .ic{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;background:var(--t);color:var(--c);flex:none}
.stat .ic svg{width:24px;height:24px}
.stat .v{font-size:28px;font-weight:700;line-height:1.1;white-space:nowrap}
.stat .l{color:var(--mut);font-size:13px;line-height:1.3}
.stk{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--soft);gap:2px}
.stk i{display:block;height:100%}
.stk.big{height:30px;border-radius:10px}
.stk.big i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:600;color:#fff}
.stk.big i.lt{color:#1c1a33}
.row{display:grid;grid-template-columns:130px minmax(0,1fr) 72px;gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row b{font-weight:600}
.row .n{text-align:right;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.row.go{cursor:pointer;border-radius:10px}
.row.go:hover{background:var(--soft)}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--mut);margin-top:12px}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg span::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.track{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--c,#b9b4dc)}
.donut{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut svg{width:170px;height:170px;flex:none}
.dl{display:flex;flex-direction:column;gap:10px;flex:1;min-width:150px}
.dl div{display:grid;grid-template-columns:12px minmax(0,1fr) auto 38px;align-items:center;gap:10px}
.dl i{width:12px;height:12px;border-radius:4px;background:var(--c)}
.dl b{font-weight:700;text-align:right}
.dl .note{text-align:right}
.cls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.cl{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px}
.cl:hover{border-color:var(--pri);transform:translateY(-2px)}
.cl b{font-size:16px;font-weight:600}
.cl .m{font-size:12.5px;color:var(--mut)}
.tag{display:inline-block;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:600;background:var(--t);color:var(--c)}
table{border-collapse:collapse;width:100%}
th{font-size:12px;color:var(--mut);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.go{cursor:pointer}tr.go:hover td{background:var(--soft)}
.mx td{text-align:center;font-weight:600;height:46px;border-radius:0}
.mx td.h{text-align:left}
.callout{background:#fff4d6;color:#4a3a00;border-radius:16px;padding:16px 18px}
.callout h3{color:#4a3a00}
ul.t{margin:0;padding-left:20px}ul.t li{margin:5px 0}
.col3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.cat{border-top:5px solid var(--c)}
.cat h3{display:flex;justify-content:space-between}
.note{font-size:12.5px;color:var(--mut)}
.scroll{overflow-x:auto}
.fade{animation:f .35s ease both}
@keyframes f{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.cl:hover{transform:none}}
.lockb{display:inline-flex;align-items:center;gap:8px}
.lockb svg{width:18px;height:18px}
.lockb.on{background:var(--pri);color:#fff;border-color:var(--pri)}
#cari{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:10px 12px;font-size:16px;color:var(--ink);margin:4px 0}
#hasil{display:flex;flex-direction:column;gap:2px}
#hasil button{border:0;background:none;text-align:left;padding:7px 10px;border-radius:10px;cursor:pointer;font-size:13px;color:var(--ink)}
#hasil button:hover{background:var(--soft)}
#hasil small{display:block;color:var(--mut);font-size:11.5px}
.names{display:flex;flex-direction:column}
.names button{border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:10px 4px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--ink);min-height:44px;align-items:center}
.names button:hover{background:var(--soft)}
.names button span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.names em{font-style:normal;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;font-size:13px}
.gap{color:#f2603f;font-weight:700;margin-left:4px}
.pill{display:inline-block;padding:4px 12px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}
.pL{background:#f2603f;color:#fff}.pS{background:#ffc24b;color:#1c1a33}.pC{background:#5b4fe9;color:#fff}
.big{font-size:64px;font-weight:700;line-height:1;letter-spacing:-.02em}
.nxt{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.nxt .ib{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.locked{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
dialog{border:0;border-radius:20px;padding:26px;width:min(420px,calc(100vw - 32px));background:var(--card);color:var(--ink);box-shadow:0 20px 60px -20px rgba(20,10,80,.5)}
dialog::backdrop{background:rgba(20,16,40,.55)}
dialog h3{margin:0 0 6px;font-size:19px}
dialog input[type=password]{width:100%;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--ink);margin:12px 0 8px}
dialog .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
.btnp{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:0 18px;height:44px;font-weight:600;cursor:pointer}
#err{color:#f2603f;font-size:13px;min-height:18px}
body.kunci{display:block}
body.kunci>aside,body.kunci>main{display:none!important}
#masuk{display:none}
.kotak .logo{display:flex!important}
body.kunci #masuk{display:grid;place-items:center;min-height:100vh;padding:20px}
.kotak{background:var(--card);border-radius:22px;padding:30px;width:min(420px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px -24px rgba(30,20,90,.35)}
.kotak h2{margin:0;font-size:22px;line-height:1.2}
.kotak input[type=password]{width:100%;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--ink)}
#cariMob{display:none}
#cariMob #hasilM button{border:0;background:none;text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer;color:var(--ink);font-size:14px;width:100%}
#cariMob small{display:block;color:var(--mut);font-size:12px}
@media (max-width:1180px){.cls{grid-template-columns:repeat(2,minmax(0,1fr))}.s3{grid-column:span 6}.s8,.s7,.s5,.s4{grid-column:span 12}}
@media (max-width:860px){
 html,body{height:auto}
 body{display:block;font-size:14px}
 aside{position:sticky;top:0;height:auto;max-height:none;display:flex;flex-direction:row;align-items:center;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;padding:8px 12px calc(8px);gap:6px;z-index:20;border-right:0;border-bottom:1px solid var(--line);scrollbar-width:none;padding-top:max(8px,env(safe-area-inset-top))}
 aside::-webkit-scrollbar{display:none}
 .logo,.nh,#cariW{display:none}
 #cariMob.ada{display:block}
 .nv{flex:none;padding:6px 14px;min-height:40px;font-size:13.5px;white-space:nowrap}
 .nv svg{width:17px;height:17px}
 main{padding:16px 14px 32px;gap:16px}
 .top{gap:8px}
 .top>div:first-child{flex:1 1 100%}
 .top h1{font-size:22px}
 .top .sp,.chip,#bFull{display:none}
 .top .ib{height:40px;min-width:40px;padding:0 12px}
 .lockb span{font-size:13px}
 .grid{gap:12px}
 .card{padding:16px;border-radius:16px}
 .hero{grid-template-columns:minmax(0,1fr);padding:20px}.hero svg{display:none}
 .hero h2{font-size:22px}
 .s3{grid-column:span 6}.s6,.s8,.s7,.s5,.s4{grid-column:span 12}
 .stat{flex-direction:column;align-items:flex-start;gap:8px}
 .stat .ic{width:38px;height:38px;border-radius:11px}.stat .ic svg{width:19px;height:19px}
 .stat .v{font-size:22px}.stat .l{font-size:12px}
 .col3{grid-template-columns:minmax(0,1fr)}
 .row{grid-template-columns:88px minmax(0,1fr) 54px;gap:8px;font-size:13px}
 .donut svg{width:140px;height:140px}
 .big{font-size:48px}
 .mx td{height:40px}
}
@media (max-width:520px){.cls{grid-template-columns:repeat(2,minmax(0,1fr))}.cl{padding:12px}.cl b{font-size:14px}}
</style>
</head>
<body class="kunci">
<aside id="side" aria-label="Navigasi"></aside>
<main>
  <div class="top">
    <div><h1 id="ttl">Dialog Prestasi Matematik</h1><div class="sub" id="sub"></div></div>
    <span class="sp"></span>
    <span class="chip">SK Paya Redan · Sesi 2026</span>
    <button class="ib" id="bPrev" aria-label="Paparan sebelum">◀</button>
    <button class="ib" id="bNext" aria-label="Paparan seterusnya">▶</button>
    <button class="ib" id="bFull">Skrin penuh</button>
    <button class="ib lockb" id="bKeluar"></button>
  </div>
  <div id="cariMob"></div>
  <div id="view"></div>
  <p class="note" id="kaki"></p>
</main>
<div id="masuk">
  <form id="fMasuk" class="kotak">
    <div class="logo" style="padding:0 0 10px"><i>∑</i><span>Panitia Matematik<small>SK Paya Redan</small></span></div>
    <h2>Dialog Prestasi Matematik 2026</h2>
    <p class="note" style="margin:0">Halaman ini mengandungi data murid. Masukkan kata laluan untuk masuk.</p>
    <input type="password" id="pw" autocomplete="current-password" placeholder="Kata laluan" aria-label="Kata laluan" required>
    <label class="note" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="ingat"> Ingat pada peranti ini (jangan guna di komputer kongsi)</label>
    <div id="err" role="alert"></div>
    <button type="submit" class="btnp" id="bBuka" style="width:100%">Masuk</button>
  </form>
</div>

  } else lines.push(`TP Matematik ${s.tp.MM} berbanding purata kelas ${f1(k.avgTP)}.${k.uasaFile?' Markah UASA Matematik tercatat “Tidak Ditaksir”.':''}`);
  const d = s.tp.MM - s.oth;
  lines.push(Math.abs(d) < .3 ? `TP Matematik setara dengan purata TP subjek lain (${f1(s.oth)}).` : `TP Matematik ${f1(Math.abs(d))} ${d<0?'lebih rendah':'lebih tinggi'} daripada purata TP subjek lain (${f1(s.oth)}).`);
  const cad = {L:['Masukkan dalam kelas bimbingan kumpulan kecil.','Diagnostik kemahiran asas: nilai tempat, sifir, empat operasi.','Latih tubi fakta asas setiap hari; pantau setiap bulan.'],

    C:['Pengayaan dan soalan KBAT.','Pembimbing rakan sebaya.','Calon pertandingan Matematik.']}[s.cat];
  const i = k.s.indexOf(s), pv = k.s[i-1], nx = k.s[i+1];
  return `<div class="grid">
  <div class="card s12" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">${pill(s.cat)}${s.gap?'<span class="pill" style="border:2px solid #f2603f;color:#f2603f">Jurang PBD–UASA</span>':''}<span class="note">${s.j==='L'?'Lelaki':'Perempuan'} · Bil. ${s.b} daripada ${k.n}${s.u?` · Usaha (guru MP): ${esc(s.u.toLowerCase())}`:''}</span></div>
  <div class="card s3" style="background:var(--pri);color:#fff"><div style="font-size:13px;opacity:.85">TP Matematik (PBD)</div><div class="big">${s.tp.MM}</div><div style="font-size:12.5px;opacity:.85">purata kelas ${f1(k.avgTP)}</div></div>
  <div class="card s3"><div class="note">UASA Matematik</div>${s.m!=null?`<div class="big">${s.m}<span style="font-size:26px"> ${esc(s.g)}</span></div><div class="note">purata kelas ${f1(k.uAvg)} · kedudukan ${s.rank}/${k.nu}</div>`:`<div style="font-size:20px;font-weight:700;margin-top:14px">${k.uasaFile?'Tidak Ditaksir':'Tiada data'}</div>`}</div>
  <div class="card s6"><h3>Analisis</h3><ul class="t">${lines.map(l=>`<li>${l}</li>`).join('')}</ul></div>
  <div class="card s6"><h3>TP semua subjek (PBD)</h3><p class="cap">Matematik ditanda indigo</p>
    ${Object.entries(s.tp).filter(e=>e[1]!=null).map(([a,v])=>`<div class="row" style="grid-template-columns:96px minmax(0,1fr) 44px;padding:6px 0"><span style="${a==='MM'?'font-weight:700':''}">${NAMA_SUBJ[a]||(a==='PM'?'Pend. Moral':esc(a))}</span><div class="track" style="--c:${a==='MM'?'#5b4fe9':'#c9c4ec'}"><i style="width:${v/6*100}%"></i></div><span class="n">TP${v}</span></div>`).join('')}</div>
  <div class="card s6"><h3>Cadangan</h3><ul class="t">${cad.map(l=>`<li>${l}</li>`).join('')}</ul>
    <div class="nxt">${pv?`<button class="ib" data-go="m-${k.id}-${pv.b}">◀ ${esc(shortN(pv.n))}</button>`:''}<button class="ib" data-go="k-${k.id}">Kelas</button>${nx?`<button class="ib" data-go="m-${k.id}-${nx.b}">${esc(shortN(nx.n))} ▶</button>`:''}</div></div>
</div>`;
};

/* ---------- pintu masuk: seluruh data disulitkan (AES-256-GCM, PBKDF2-SHA256) ---------- */
const SIMPAN = 'panitia-mm-pw';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const nyahsulit = async pw => {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(ENC.s), iterations:ENC.it, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(ENC.iv)}, key, b64(ENC.ct));
  return JSON.parse(new TextDecoder().decode(pt));
};
const masuk = async (pw, ingat) => {
  const x = await nyahsulit(pw);
  if (ingat) { try { localStorage.setItem(SIMPAN, pw); } catch(e) {} }
  mula(x.agg, x.subj, x.murid);
};
const err = document.getElementById('err'), btn = document.getElementById('bBuka');
document.getElementById('fMasuk').addEventListener('submit', async e => {
  e.preventDefault(); btn.disabled = true; btn.textContent = 'Membuka…'; err.textContent = '';
  try { await masuk(document.getElementById('pw').value, document.getElementById('ingat').checked); }
  catch(x) { err.textContent = window.crypto?.subtle ? 'Kata laluan salah.' : 'Pelayar ini tidak menyokong penyahsulitan. Buka melalui https.'; btn.disabled = false; btn.textContent = 'Masuk'; }
});
(async () => { let pw = null; try { pw = localStorage.getItem(SIMPAN); } catch(e) {}
  if (pw) { try { await masuk(pw, false); return; } catch(e) { try { localStorage.removeItem(SIMPAN); } catch(x) {} } }
  document.getElementById('pw').focus(); })();
}
