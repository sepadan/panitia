<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f6eefd">
<title>Panitia Sepadan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE dashboard sekolah, mesra dan lembut untuk dialog prestasi guru
   IDEA buku catatan pastel sekolah rendah: setiap subjek ada warna sendiri seperti penanda buku
   PICTURE kad subjek berwarna pastel di menu utama; bar bertindan TP/gred; donat kategori
   COLOUR latar kecerunan pastel merah jambu-lavender-biru; kad putih lut; aksen ikut subjek; teks gelap
   TYPE Poppins 600/700 tajuk, Poppins 400 teks
   LAYOUT bar sisi 260px + grid kad; telefon: nav mendatar melekat di atas, kad satu atau dua lajur */
:root{color-scheme:light;
 --bg:light-dark(linear-gradient(140deg,#fde9f2 0%,#f1ebff 42%,#e4f3ff 78%,#e9fbf2 100%),linear-gradient(140deg,#231b2e 0%,#1c1a30 45%,#152230 100%));
 --card:light-dark(rgba(255,255,255,.86),rgba(38,33,58,.88));--ink:light-dark(#2a2440,#efeaff);--mut:light-dark(#7d7696,#b1aacb);
 --line:light-dark(#ece6f6,#3a3352);--soft:light-dark(#f6f2fd,#2e2847);--acc:#b9a7ff;--accd:light-dark(#5b48c9,#cbbfff);
 --L:#ff8e8e;--S:#ffd36e;--C:#7f8cf2}
:root[data-theme]{color-scheme:light}
*{box-sizing:border-box;min-width:0}
html{min-height:100%;background:light-dark(#f1ebff,#1c1a30)}
body{margin:0;min-height:100vh;background:var(--bg);background-attachment:fixed;color:var(--ink);font:15px/1.5 Poppins,system-ui,sans-serif;display:grid;grid-template-columns:260px minmax(0,1fr);overflow-x:clip}
button,select,input{font:inherit;color:inherit}
aside{background:light-dark(rgba(255,255,255,.7),rgba(30,26,46,.85));border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;height:100vh;position:sticky;top:0;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;line-height:1.2;padding:0 8px 14px}
.logo i{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#ffb5c8,#b9a7ff);color:#2a2440;display:grid;place-items:center;font-style:normal;font-size:20px;flex:none}
.logo small{display:block;font-weight:500;font-size:12px;color:var(--mut)}
.nh{font-size:12px;color:var(--mut);font-weight:600;padding:12px 10px 4px}
.nv{display:flex;align-items:center;gap:12px;border:0;background:none;text-align:left;padding:8px 12px;border-radius:13px;cursor:pointer;color:var(--mut);font-weight:500;min-height:42px}
.nv svg{width:20px;height:20px;flex:none}
.nv:hover{background:var(--soft);color:var(--ink)}
.nv.on{background:var(--acc);color:#2a2440;font-weight:600}
.nv .dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none;margin:0 6px}
.selS{display:flex;align-items:center;gap:8px;background:var(--acc);border-radius:14px;padding:6px 6px 6px 12px;margin:2px 0 6px;color:#2a2440}
.selS select{flex:1;border:0;background:rgba(255,255,255,.65);border-radius:10px;padding:8px;font-size:15px;font-weight:600;color:#2a2440;min-height:40px}
main{padding:24px clamp(16px,3vw,36px) 40px;display:flex;flex-direction:column;gap:20px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:26px;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em}
.top .sub{color:var(--mut);font-size:14px}
.top .sp{flex:1}
.chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 16px;font-size:13px;font-weight:600;white-space:nowrap}
.ib{border:1px solid var(--line);background:var(--card);border-radius:13px;min-width:44px;height:44px;cursor:pointer;font-weight:600;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.ib svg{width:18px;height:18px}
.ib:hover{border-color:var(--accd)}
.ib:focus-visible,.nv:focus-visible,.cl:focus-visible,.sc:focus-visible{outline:3px solid var(--accd);outline-offset:2px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(12,minmax(0,1fr))}
.card{background:var(--card);border-radius:22px;padding:22px;box-shadow:0 1px 2px rgba(80,50,140,.04),0 10px 28px -16px rgba(80,50,140,.22)}
.card h3{margin:0 0 4px;font-size:17px;font-weight:600}
.card .cap{color:var(--mut);font-size:13px;margin:0 0 14px}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}.s3{grid-column:span 3}
.hero{background:var(--acc);color:#2a2440;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);align-items:center;gap:20px;padding:28px 32px;overflow:hidden}
.hero h2{font-size:clamp(23px,2.5vw,34px);line-height:1.12;margin:6px 0 10px;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
.hero p{margin:0;max-width:540px;color:#3d3558}
.hero .k{font-size:13px;color:#4b4268;font-weight:500}
.hero svg{width:100%;max-height:200px}
.stat{display:flex;align-items:center;gap:14px}
.stat .ic{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:var(--t);color:#2a2440;flex:none}
.stat .ic svg{width:24px;height:24px}
.stat .v{font-size:28px;font-weight:700;line-height:1.1;white-space:nowrap}
.stat .l{color:var(--mut);font-size:13px;line-height:1.3}
.stk{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--soft);gap:2px}
.stk i{display:block;height:100%}
.stk.big{height:30px;border-radius:11px}
.stk.big i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:600;color:#2a2440}
.stk.big i.dk{color:#fff}
.row{display:grid;grid-template-columns:100px minmax(0,1fr) 72px;gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row b{font-weight:600}
.row .n{text-align:right;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.row.go{cursor:pointer;border-radius:10px}
.row.go:hover{background:var(--soft)}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--mut);margin-top:12px}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg span::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.track{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--c,#d7cff5)}
.donut{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut svg{width:160px;height:160px;flex:none}
.dl{display:flex;flex-direction:column;gap:10px;flex:1;min-width:150px}
.dl div{display:grid;grid-template-columns:12px minmax(0,1fr) auto 38px;align-items:center;gap:10px}
.dl i{width:12px;height:12px;border-radius:4px;background:var(--c)}
.dl b{font-weight:700;text-align:right}
.dl .note{text-align:right}
.scs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.sc{border:0;border-radius:22px;padding:18px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;background:var(--c);color:#2a2440;box-shadow:0 10px 24px -18px rgba(80,50,140,.5);transition:transform .15s}
.sc:hover{transform:translateY(-3px)}
.sc b{font-size:17px;font-weight:700}
.sc .v{font-size:26px;font-weight:700;line-height:1.1}
.sc .m{font-size:12.5px;color:#4b4268}
.sc .stk{background:rgba(255,255,255,.55)}
.cls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.cl{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.cl:hover{border-color:var(--accd)}
.cl b{font-size:15px;font-weight:600}
.cl .m{font-size:12.5px;color:var(--mut)}
table{border-collapse:collapse;width:100%}
th{font-size:12px;color:var(--mut);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.go{cursor:pointer}tr.go:hover td{background:var(--soft)}
.rowp{grid-template-columns:170px minmax(0,1fr) 72px}
.heat td.n{font-weight:600;text-align:center}
.mx td{text-align:center;font-weight:600;height:46px}
.mx td.h{text-align:left}
.callout{background:light-dark(#fff3c9,#4a3f1d);color:light-dark(#4a3a00,#ffe9a8);border-radius:18px;padding:16px 18px}
.callout h3{color:inherit}
ul.t{margin:0;padding-left:20px}ul.t li{margin:5px 0}
.col3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.cat{border-top:6px solid var(--c)}
.cat h3{display:flex;justify-content:space-between}
.note{font-size:12.5px;color:var(--mut)}
.scroll{overflow-x:auto}
.names{display:flex;flex-direction:column}
.names button{border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:10px 4px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--ink);min-height:44px;align-items:center}
.names button:hover{background:var(--soft)}
.names button span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.names em{font-style:normal;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;font-size:13px}
.gap{color:#e5484d;font-weight:700;margin-left:4px}
.pill{display:inline-block;padding:4px 12px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap;color:#2a2440}
.pL{background:var(--L)}.pS{background:var(--S)}.pC{background:var(--C);color:#fff}
.big{font-size:64px;font-weight:700;line-height:1;letter-spacing:-.02em}
.nxt{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.nxt .ib{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;line-height:42px}
#cari{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:13px;padding:10px 12px;font-size:16px;color:var(--ink);margin:4px 0}
.hasil{display:flex;flex-direction:column;gap:2px}
.hasil button{border:0;background:none;text-align:left;padding:7px 10px;border-radius:10px;cursor:pointer;font-size:13px;color:var(--ink)}
.hasil button:hover{background:var(--soft)}
.hasil small{display:block;color:var(--mut);font-size:11.5px}
#cariMob{display:none}
#err{color:#e5484d;font-size:13px;min-height:18px}
body.kunci{display:block}
body.kunci>aside,body.kunci>main{display:none!important}
#masuk{display:none}
body.kunci #masuk{display:grid;place-items:center;min-height:100vh;padding:20px}
.kotak{background:var(--card);border-radius:26px;padding:30px;width:min(420px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:0 24px 60px -28px rgba(80,50,140,.45)}
.kotak h2{margin:0;font-size:22px;line-height:1.2}
.kotak input[type=password]{width:100%;font-size:16px;padding:12px 14px;border-radius:13px;border:1px solid var(--line);background:var(--soft);color:var(--ink)}
.kotak .logo{display:flex!important;padding:0 0 6px}
.btnp{background:linear-gradient(135deg,#ffb5c8,#b9a7ff);color:#2a2440;border:0;border-radius:13px;padding:0 18px;height:46px;font-weight:700;cursor:pointer}
.fade{animation:f .35s ease both}
@keyframes f{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.sc{transition:none}.sc:hover{transform:none}}

#pCtl{display:none}
.rlist{display:flex;flex-direction:column}
.ri{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:6px 16px;align-items:center;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:10px 4px;cursor:pointer;color:var(--ink);font-size:14px}
.ri:hover{background:var(--soft)}
.ri .rn{display:flex;flex-direction:column}
.ri .rn b{font-weight:600}
.ri .rc{display:flex;flex-wrap:wrap;gap:4px}
@media (max-width:860px){.ri{grid-template-columns:minmax(0,1fr)}}
body.present{display:block;font-size:17px}
body.present>aside,body.present .top .ib,body.present #cariMob,body.present main>.note{display:none!important}
body.present main{padding:28px 48px 90px;max-width:1500px;margin:0 auto}
body.present .top h1{font-size:34px}
body.present .card h3{font-size:20px}
body.present #pCtl{display:flex;gap:8px;position:fixed;right:18px;bottom:18px;z-index:30;opacity:.35;transition:opacity .2s}
body.present #pCtl:hover{opacity:1}
@media print{
 @page{size:A4;margin:12mm}
 html,body{background:#fff!important}
 body{display:block;font-size:11pt;color:#000}
 aside,.top .ib,#cariMob,#pCtl,#masuk{display:none!important}
 main{padding:0;gap:10px}
 .card{box-shadow:none;border:1px solid #ddd;break-inside:avoid;background:#fff!important}
 .card.s12{break-inside:auto}
 .s3{grid-column:span 3!important}.s4{grid-column:span 4!important}.s6,.s5,.s7,.s8{grid-column:span 6!important}.s12{grid-column:span 12!important}
 .names button,.ri,tr{break-inside:avoid}
 .hero,.sc{border:1px solid #ccc}
 .grid{gap:10px}
 .row.go:hover,tr.go:hover td{background:none}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (max-width:1180px){.cls,.scs{grid-template-columns:repeat(3,minmax(0,1fr))}.s3{grid-column:span 6}.s8,.s7,.s5,.s4{grid-column:span 12}}
@media (max-width:860px){
 body{display:block;font-size:14px}
 aside{position:sticky;top:0;height:auto;display:flex;flex-direction:row;align-items:center;overflow-x:auto;overflow-y:hidden;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));gap:6px;z-index:20;border-right:0;border-bottom:1px solid var(--line);scrollbar-width:none;background:light-dark(rgba(255,255,255,.92),rgba(30,26,46,.95))}
 aside::-webkit-scrollbar{display:none}
 aside .logo,.nh,#cariW{display:none}
 .selS{flex:none;margin:0;padding:4px 4px 4px 10px}
 .selS span{display:none}
 .selS select{font-size:14px;min-height:36px;padding:4px 6px}
 .nv{flex:none;padding:6px 13px;min-height:40px;font-size:13.5px;white-space:nowrap}
 .nv svg{width:17px;height:17px}
 main{padding:16px 14px 32px;gap:14px}
 .top{gap:8px}
 .top>div:first-child{flex:1 1 100%}
 .top h1{font-size:22px}
 .top .sp,.chip,#bFull{display:none}
 .top .ib{height:40px;min-width:40px;padding:0 12px}
 #cariMob.ada{display:block}
 .grid{gap:12px}
 .card{padding:16px;border-radius:18px}
 .hero{grid-template-columns:minmax(0,1fr);padding:20px}.hero svg{display:none}
 .hero h2{font-size:22px}
 .s3{grid-column:span 6}.s6,.s8,.s7,.s5,.s4{grid-column:span 12}
 .stat{flex-direction:column;align-items:flex-start;gap:8px}
 .stat .ic{width:38px;height:38px;border-radius:12px}.stat .ic svg{width:19px;height:19px}
 .stat .v{font-size:22px}.stat .l{font-size:12px}
 .col3{grid-template-columns:minmax(0,1fr)}
 .row{grid-template-columns:74px minmax(0,1fr) 54px;gap:8px;font-size:13px}
 .donut svg{width:136px;height:136px}
 .rowp{grid-template-columns:1fr 64px;row-gap:4px}.rowp .stk{grid-column:1/-1;grid-row:2}.rowp .n{grid-row:1;grid-column:2}
 .big{font-size:48px}
 .mx td{height:40px}
 .scs{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
 .sc{padding:14px;border-radius:18px}.sc .v{font-size:22px}
}
@media (max-width:520px){.cls{grid-template-columns:repeat(2,minmax(0,1fr))}.cl{padding:12px}}
</style>
</head>
<body class="kunci">
<div id="masuk">
  <form id="fMasuk" class="kotak">
    <div class="logo"><i>∑</i><span>Dialog Prestasi 2026<small>SK Paya Redan</small></span></div>
    <h2>Panitia Sepadan</h2>
    
    <input type="password" id="pw" autocomplete="current-password" placeholder="Kata laluan" aria-label="Kata laluan" required>
    <label class="note" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="ingat"> Ingat pada peranti ini (jangan guna di komputer kongsi)</label>
    <div id="err" role="alert"></div>
    <button type="submit" class="btnp" id="bBuka" style="width:100%">Masuk</button>
  </form>
</div>
<aside id="side" aria-label="Navigasi"></aside>
<main>
  <div class="top">
    <div><h1 id="ttl">Panitia Sepadan</h1><div class="sub" id="sub"></div></div>
    <span class="sp"></span>
    <button class="ib" id="bPrev" aria-label="Paparan sebelum">◀</button>
    <button class="ib" id="bNext" aria-label="Paparan seterusnya">▶</button>
    <button class="ib" id="bCetak">Cetak</button>
    <button class="ib" id="bFull">Persembahan</button>
    <button class="ib" id="bKeluar"></button>
  </div>
  <div id="cariMob" class="card"></div>
  <div id="pCtl"><button class="ib" id="pPrev" aria-label="Sebelum">◀</button><button class="ib" id="pNext" aria-label="Seterusnya">▶</button><button class="ib" id="pKeluar">Keluar</button></div>
  <div id="view"></div>
  <p class="note">TP = tahap penguasaan PBD (1–6). Lulus UASA = gred A–D (35 markah ke atas). Data sulit; jangan tayang di skrin awam.</p>
</main>

  ['SEJ','Sejarah','#ffdcae'],['PAI','Pendidikan Islam','#c3ecb8'],['PM','Pendidikan Moral','#e2d4ff'],['AR','Bahasa Arab','#a9e7e4'],

const SN = Object.fromEntries(SUB.map(s=>[s[0],s[1]])), SC = Object.fromEntries(SUB.map(s=>[s[0],s[2]]));

/* ---------- analisis mengikut subjek ---------- */
const CACHE = {};
const analisis = sb => {
  if (CACHE[sb]) return CACHE[sb];
  const K = [];
  for (const kl of KLS) {
    const raw = kl.s.filter(s => s.tp[sb] != null);
    if (!raw.length) continue;
    const ss = raw.map(s => {
      const ua = s.ua && s.ua[sb];
      const o = Object.entries(s.tp).filter(([a,v])=>a!==sb && v!=null).map(e=>e[1]);
      const v = {s, tp:s.tp[sb], m:ua?ua[0]:null, g:ua?ua[1]:null, u:ua?ua[2]:null, oth:avg(o)};
      v.cat = v.m != null ? (v.m>=66?'C':v.m>=35?'S':'L') : (v.tp>=5?'C':v.tp>=3?'S':'L');
      v.gap = v.m != null && v.tp >= 4 && v.m < 35;
      return v;
    });
    const ms = ss.filter(v=>v.m!=null).map(v=>v.m);
    const k = {id:kl.id, nama:kl.nama, s:ss, n:ss.length, uasaFile:kl.uasaFile, hasU:ms.length>0,
      td: kl.uasaFile && !ms.length,
      dist:[1,2,3,4,5,6].map(t=>ss.filter(v=>v.tp===t).length), avgTP:avg(ss.map(v=>v.tp)), oth:avg(ss.map(v=>v.oth).filter(x=>x!=null)),
      cat:{L:ss.filter(v=>v.cat==='L').length,S:ss.filter(v=>v.cat==='S').length,C:ss.filter(v=>v.cat==='C').length}};
    for (const v of ss) v.rank = 1 + ss.filter(x => k.hasU ? x.m > v.m : x.tp > v.tp).length;
    const jan = j => { const g = ss.filter(v=>v.s.j===j); return {n:g.length, tp:avg(g.map(v=>v.tp)), u:avg(g.filter(v=>v.m!=null).map(v=>v.m))}; };
    k.jan = {L:jan('L'), P:jan('P')};
    if (k.hasU) {
      Object.assign(k, {nu:ms.length, uAvg:avg(ms), lulus:ms.filter(m=>m>=35).length, cplus:ms.filter(m=>m>=50).length,
        grd:'ABCDEF'.split('').map(g=>ss.filter(v=>v.g===g).length), gap:ss.filter(v=>v.gap).length});
      k.jx = [1,2,3,4,5,6].map(t => { const g = ss.filter(v=>v.tp===t && v.m!=null); return g.length ? {t, C:g.filter(v=>v.cat==='C').length, S:g.filter(v=>v.cat==='S').length, L:g.filter(v=>v.cat==='L').length, avg: g.length>=3 ? avg(g.map(v=>v.m)) : null} : null; }).filter(Boolean);
      k.usaha = ['SANGAT TINGGI','TINGGI','SEDERHANA','RENDAH'].map(u=>ss.filter(v=>v.u===u).length);
    }
    K.push(k);
  }
  const all = K.flatMap(k=>k.s), us = all.filter(v=>v.m!=null);
  const T = {n:all.length, dist:[1,2,3,4,5,6].map(t=>all.filter(v=>v.tp===t).length), avgTP:avg(all.map(v=>v.tp)),
    uN:us.length, uAvg:avg(us.map(v=>v.m)), lulus:us.filter(v=>v.m>=35).length, cplus:us.filter(v=>v.m>=50).length, ef:us.filter(v=>v.m<35).length,
    gap:us.filter(v=>v.gap).length, tp4u:us.filter(v=>v.tp>=4).length,
    cat:{L:all.filter(v=>v.cat==='L').length,S:all.filter(v=>v.cat==='S').length,C:all.filter(v=>v.cat==='C').length},
    oth:avg(all.map(v=>v.oth).filter(x=>x!=null)), kU:K.filter(k=>k.hasU).map(k=>k.nama)};
  T.tp4 = T.dist[3]+T.dist[4]+T.dist[5]; T.tp56 = T.dist[4]+T.dist[5];
  return CACHE[sb] = {K, T};
};
const ADA = SUB.filter(s => analisis(s[0]).T.n > 0);
/* kedudukan purata UASA antara subjek (kelas Tahun 5–6 yang sama) */
const uasaRank = sb => { const L = ADA.filter(s=>analisis(s[0]).T.uN>0).map(s=>[s[0],analisis(s[0]).T.uAvg]).sort((a,b)=>a[1]-b[1]); return {pos:L.findIndex(x=>x[0]===sb)+1, n:L.length}; };

const ico = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;

const donut = c => { const tot = c.L+c.S+c.C, R = 70, C2 = 2*Math.PI*R; let off = 0;
  const seg = (v,col) => { if (!v) return ''; const len = v/tot*C2; const s = `<circle cx="85" cy="85" r="${R}" fill="none" stroke="${col}" stroke-width="22" stroke-dasharray="${Math.max(len-3,0)} ${C2}" stroke-dashoffset="${-off}" transform="rotate(-90 85 85)"/>`; off += len; return s; };
  return `<div class="donut"><svg viewBox="0 0 170 170" aria-label="Kategori murid">${seg(c.L,'#ff8e8e')}${seg(c.S,'#ffd36e')}${seg(c.C,'#7f8cf2')}<text x="85" y="82" text-anchor="middle" font-size="28" font-weight="700" fill="currentColor">${tot}</text><text x="85" y="104" text-anchor="middle" font-size="12" fill="currentColor" opacity=".6">murid</text></svg>
  <div class="dl">${[['L','Lemah'],['S','Sederhana'],['C','Cemerlang']].map(([k,n])=>`<div style="--c:${CATC[k]}"><i></i>${n}<b>${c[k]}</b><span class="note">${pc(c[k],tot)}%</span></div>`).join('')}</div></div>`; };

const KCOL = {'4b':'#7f8cf2','5b':'#4fb8a6','5c':'#f2a15a','6b':'#d46aa8'};
const scatter = UK => { const W = 720, H = 360, L = 44, R = 12, Tp = 12, B = 36, xs = t => L + (t-0.5)/6*(W-L-R), ys = m => Tp + (1-m/100)*(H-Tp-B);

    <li>Perlukah moderasi TP antara guru sebelum laporan dimuktamadkan?</li>

</div>`; };

V.kategori = () => { const {K, T} = analisis(SB);

</div>`; };

V.cadangan = () => { const {K, T} = analisis(SB); const lemahK = K.filter(k=>k.cat.L>0).sort((a,b)=>b.cat.L-a.cat.L).slice(0,2).map(k=>k.nama);

const kelas = k => {

const murid = (k, v) => {
  const s = v.s, lines = [];
  if (v.m != null) {
    lines.push(`UASA ${v.m} (${esc(v.g)}), ${v.m>k.uAvg+.05?'atas':v.m<k.uAvg-.05?'bawah':'sama dengan'} purata kelas ${f1(k.uAvg)}.`);

  } else lines.push(`TP${v.tp}, purata kelas ${f1(k.avgTP)}.`);
  const d = v.tp - v.oth;
  if (v.oth != null && Math.abs(d) >= .3) lines.push(`${d<0?'Lebih rendah':'Lebih tinggi'} daripada purata TP subjek lain (${f1(v.oth)}).`);
  const cad = {L:['Bimbingan kumpulan kecil.',`Diagnostik: ${ASAS[SB]||'kemahiran asas'}.`],S:['Latihan topik lemah.','Sasaran naik satu gred.'],C:['Pengayaan dan KBAT.','Pembimbing rakan sebaya.']}[v.cat];
  const i = k.s.indexOf(v), pv = k.s[i-1], nx = k.s[i+1];
  const ua = s.ua || {};
  return `<div class="grid">
  <div class="card s12" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><span class="pill p${v.cat}">${CATN[v.cat]}</span>${v.gap?'<span class="pill" style="border:2px solid #e5484d;color:#e5484d;background:none">TP tidak selari UASA</span>':''}<span class="note">${s.j==='L'?'Lelaki':'Perempuan'}${v.m!=null?` · kedudukan ${v.rank}/${k.nu} dalam kelas`:''}</span></div>
  <div class="card s3" style="background:${SC[SB]};color:#2a2440"><div style="font-size:13px">TP ${esc(SN[SB])}</div><div class="big">${v.tp}</div></div>
  <div class="card s3"><div class="note">UASA ${esc(SN[SB])}</div>${v.m!=null?`<div class="big">${v.m}<span style="font-size:26px"> ${esc(v.g)}</span></div>`:`<div style="font-size:20px;font-weight:700;margin-top:14px">${k.td?'Tidak ditaksir':'Tiada'}</div>`}</div>
  <div class="card s6"><h3>Analisis</h3><ul class="t">${lines.map(l=>`<li>${l}</li>`).join('')}</ul><h3 style="margin-top:14px">Cadangan</h3><ul class="t">${cad.map(l=>`<li>${l}</li>`).join('')}</ul></div>

    ${SUB.filter(([c])=>s.tp[c]!=null).map(([c])=>`<div class="row go" data-go="${c.toLowerCase()}-m-${k.id}-${s.b}" style="grid-template-columns:96px minmax(0,1fr) 44px${s.ua?' 52px':''};padding:6px 0"><span style="${c===SB?'font-weight:700':''}">${SHORT[c]}</span><div class="track" style="--c:${SC[c]}"><i style="width:${s.tp[c]/6*100}%"></i></div><span class="n">TP${s.tp[c]}</span>${s.ua?`<span class="n note">${ua[c]&&ua[c][0]!=null?ua[c][0]+' '+esc(ua[c][1]):'—'}</span>`:''}</div>`).join('')}
    <div class="nxt">${pv?`<button class="ib" data-go="${sl()}-m-${k.id}-${pv.s.b}">◀ ${esc(shortN(pv.s.n))}</button>`:''}<button class="ib" data-go="${sl()}-k-${k.id}">Kelas</button>${nx?`<button class="ib" data-go="${sl()}-m-${k.id}-${nx.s.b}">${esc(shortN(nx.s.n))} ▶</button>`:''}</div></div>
</div>`; };


/* ---------- murid berisiko merentas subjek ---------- */
const RISIKO = (() => { const map = new Map();
  for (const [c] of ADA) for (const k of analisis(c).K) for (const v of k.s) {
    const key = k.id + '-' + v.s.b; if (!map.has(key)) map.set(key, {k, s:v.s, L:[], n:0});
    const r = map.get(key); r.n++; if (v.cat === 'L') r.L.push(c); }
  return [...map.values()].filter(r => r.L.length >= 3).sort((a,b) => b.L.length - a.L.length || a.k.id.localeCompare(b.k.id)); })();
V.risiko = () => { const byK = KLS.map(kl => [kl, RISIKO.filter(r=>r.k.id===kl.id).length]).filter(x=>x[1]);

/* ---------- prasekolah (berasingan daripada murid perdana) ---------- */

for (const m of PR.murid) { m.avg = avg(m.v); m.cat = m.avg>=2.5?'C':m.avg>=1.75?'S':'L'; m.nT = m.v.filter(x=>x===3).length; }
const PRA_CAD = {'Sosioemosi':'Aktiviti berkumpulan dan main peranan untuk membina keyakinan dan mengurus emosi.','Fizikal & Kesejahteraan Diri':'Aktiviti motor halus dan kasar harian; rutin kebersihan dan keselamatan.','Pendidikan Islam':'Latih tubi hafazan surah pendek dan amali wuduk serta solat.','Pendidikan Kewarganegaraan':'Tugasan tanggungjawab harian di kelas (ketua kumpulan, jadual bertugas).','Bahasa Melayu':'Bacaan berbimbing harian, kad suku kata dan bercerita bergambar.','Bahasa Inggeris':'Phonics harian, lagu dan arahan mudah dalam Bahasa Inggeris dengan bantuan visual.','Kognitif':'Aktiviti meneroka, menyusun dan membanding objek; permainan nombor.','Kreativiti & Estetika':'Aktiviti seni bebas dan persembahan kecil; galakkan murid menceritakan karya.'};
const praRingkas = () => { const M = PR.murid, n = M.length;

  const B = PR.bid.map((b,i) => { const c = [1,2,3].map(l=>M.filter(m=>m.v[i]===l).length); return {b, i, c, avg: avg(M.map(m=>m.v[i]))}; }).sort((x,y)=>x.avg-y.avg);

  const jn = j => { const g = M.filter(m=>m.j===j); return g.length ? `${g.length} murid · purata ${f1(avg(g.map(m=>m.avg)))}/3` : '—'; };

  ${stat('star',cat.C,'cemerlang','#d4ddff')}

  <div class="card s8"><h3>Tahap mengikut bidang</h3><p class="cap">Bilangan murid di tahap rendah · sederhana · tinggi. Bidang paling lemah di atas.</p>
    ${B.map(x=>`<div class="row rowp"><b>${esc(x.b.n)}</b>${stk(x.c,{1:'var(--L)',2:'var(--S)',3:'var(--C)'},[1,2,3],1)}<span class="n">${pc(x.c[2],n)}% tinggi</span></div>`).join('')}
    <div class="leg"><span style="--c:var(--L)">Rendah</span><span style="--c:var(--S)">Sederhana</span><span style="--c:var(--C)">Tinggi</span></div></div>
  <div class="card s4"><h3>Kategori murid</h3><p class="cap">Ikut purata tahap 8 bidang</p>${pdonut}
    <h3 style="margin-top:16px">Umur</h3>
    <div class="row" style="grid-template-columns:90px minmax(0,1fr)"><b>5 tahun</b><span>${um(5)}</span></div>
    <div class="row" style="grid-template-columns:90px minmax(0,1fr)"><b>6 tahun</b><span>${um(6)}</span></div>
    <div class="row" style="grid-template-columns:90px minmax(0,1fr)"><b>Lelaki</b><span>${jn('L')}</span></div>
    <div class="row" style="grid-template-columns:90px minmax(0,1fr)"><b>Perempuan</b><span>${jn('P')}</span></div></div>
  <div class="card s12"><h3>Senarai murid</h3><p class="cap">Tekan nama untuk profil · angka = bilangan bidang di tahap tinggi (daripada 8)</p>
  <div class="col3">${['L','S','C'].map(c => { const ss = M.filter(m=>m.cat===c).sort((a,b)=>b.avg-a.avg);

    <p class="note">Cemerlang: purata tahap 2.5 ke atas · Sederhana: 1.75–2.49 · Perlu bimbingan: bawah 1.75 (rendah = 1, sederhana = 2, tinggi = 3).</p></div>
  <div class="card s12 callout"><h3>Cadangan untuk bidang paling lemah</h3><ul class="t">${B.slice(0,3).map(x=>`<li><b>${esc(x.b.n)}</b> (${x.c[0]} murid rendah): ${PRA_CAD[x.b.n]||''}</li>`).join('')}</ul></div>
  <p class="note s12">Laporan prasekolah tidak memberi TP. Tahap ditafsir daripada pernyataan ulasan guru: setiap bidang ada tiga pernyataan standard yang menggambarkan tahap rendah, sederhana dan tinggi.</p>
</div>`; };
const praMurid = m => { const M = PR.murid, i = M.indexOf(m), pv = M[i-1], nx = M[i+1];
  return `<div class="grid">
  <div class="card s12" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><span class="pill p${m.cat}">${PCAT[m.cat]}</span><span class="note">${m.j==='L'?'Lelaki':'Perempuan'} · ${m.umur} tahun · ${m.nT} daripada 8 bidang di tahap tinggi</span></div>

    ${m.ul?`<p style="margin:14px 0 0"><b>Ulasan keseluruhan:</b> ${esc(m.ul)}</p>`:''}
    <div class="nxt">${pv?`<button class="ib" data-go="pra-m-${pv.b}">◀ ${esc(shortN(pv.n))}</button>`:''}<button class="ib" data-go="pra">Senarai</button>${nx?`<button class="ib" data-go="pra-m-${nx.b}">${esc(shortN(nx.n))} ▶</button>`:''}</div></div>
</div>`; };

const lukisSisi = () => {
  const K = analisis(SB).K;
  side.innerHTML = `<div class="logo"><i>∑</i><span>Panitia Sepadan<small>SK Paya Redan · 2026</small></span></div>
  <button class="nv" data-go="menu">${ico('grid')}<span>Menu utama</span></button>
  <button class="nv" data-go="subjek">${ico('book')}<span>Perbandingan subjek</span></button>
  <button class="nv" data-go="risiko">${ico('alert')}<span>Murid berisiko</span></button>
  <div id="cariW"><div class="nh">Cari murid</div><input id="cari" type="search" placeholder="Taip nama murid" aria-label="Cari murid"><div class="hasil" id="hasil"></div></div>
  <div class="nh">Subjek</div>
  <label class="selS" style="background:${SC[SB]}"><span>Subjek</span><select id="selSub" aria-label="Pilih subjek">${ADA.map(([c,n])=>`<option value="${c}"${c===SB?' selected':''}>${esc(n)}</option>`).join('')}</select></label>
  ${NAV.map(([id,n,ic])=>`<button class="nv" data-go="${SB.toLowerCase()}-${id}">${ico(ic)}<span>${n}</span></button>`).join('')}
  <div class="nh">Prasekolah</div><button class="nv" data-go="pra"><span class="dot" style="--c:#ffc9a8"></span><span>${esc(PR.kelas)}</span></button>
  <div class="nh">Kelas ${esc(SN[SB])}</div>${K.map(k=>`<button class="nv" data-go="${SB.toLowerCase()}-k-${k.id}"><span class="dot" style="--c:${k.hasU?(k.uAvg<35?'#ff8e8e':k.uAvg<50?'#ffd36e':'#7f8cf2'):'#c8b8ff'}"></span><span>${esc(k.nama)}</span></button>`).join('')}`;
  document.getElementById('selSub').onchange = e => { const tail = cur.replace(/^[a-z]+-/, ''); show(e.target.value.toLowerCase() + '-' + (/^(utama|pbd|uasa|jurang|kategori|cadangan|k-\w\w|m-\w\w-\d+)$/.test(tail) ? tail : 'utama')); };
  ikatCari(document.getElementById('cari'), 'hasil');
  const cm = document.getElementById('cariMob');
  cm.classList.add('ada');
  cm.innerHTML = `<input id="cariM" type="search" placeholder="Cari nama murid" aria-label="Cari murid" style="width:100%;border:1px solid var(--line);background:var(--soft);border-radius:13px;padding:10px 12px;font-size:16px;color:var(--ink)"><div class="hasil" id="hasilM"></div>`;
  ikatCari(document.getElementById('cariM'), 'hasilM');
};
const seq = () => ['menu','subjek', ...NAV.map(n=>`${SB.toLowerCase()}-${n[0]}`), ...analisis(SB).K.map(k=>`${SB.toLowerCase()}-k-${k.id}`)];
let cur = 'menu';
const show = h => {
  if (h === 'pra' || /^pra-m-\d+$/.test(h)) {
    const pm = h.match(/^pra-m-(\d+)$/), m = pm && PR.murid.find(x=>x.b===+pm[1]);
    if (pm && !m) h = 'pra';
    cur = h; if (!side.innerHTML) lukisSisi();
    document.documentElement.style.setProperty('--acc', '#ffd6c0');
    document.getElementById('view').innerHTML = `<div class="fade">${m ? praMurid(m) : praRingkas()}</div>`;
    document.getElementById('cariMob').style.display = 'none';
    document.getElementById('ttl').textContent = m ? m.n : PR.kelas;
    document.getElementById('sub').textContent = m ? `${PR.kelas} · profil murid` : 'Laporan perkembangan murid prasekolah 2026 (perekodan 2)';
    document.title = (m ? shortN(m.n) : PR.kelas) + ' · Panitia Sepadan';
    side.querySelectorAll('.nv').forEach(b => b.classList.toggle('on', b.dataset.go === 'pra'));
    if (location.hash.slice(1) !== h) { try { history.replaceState(null,'','#'+h); } catch(e) {} }
    window.scrollTo(0,0); return;
  }
  let sb = SB, view = h, m;
  if ((m = h.match(/^([a-z]+)-(.+)$/)) && SN[m[1].toUpperCase()] && analisis(m[1].toUpperCase()).T.n) { sb = m[1].toUpperCase(); view = m[2]; }
  else if (h !== 'menu' && h !== 'subjek' && h !== 'risiko') { h = 'menu'; view = 'menu'; }
  const subChanged = sb !== SB; SB = sb;
  document.documentElement.style.setProperty('--acc', SC[SB]);
  const A = analisis(SB);
  let html, t, sub, navKey = h;
  const mk = view.match(/^k-(\w\w)$/), mm = view.match(/^m-(\w\w)-(\d+)$/);
  if (view === 'menu') { html = V.menu(); t = 'Pilih subjek'; sub = 'Panitia Sepadan · Dialog Prestasi 2026'; }
  else if (view === 'risiko') { html = V.risiko(); t = 'Murid berisiko'; sub = 'Lemah dalam 3 subjek atau lebih'; }
  else if (view === 'subjek') { html = V.subjek(); t = 'Perbandingan subjek'; sub = 'Purata TP dan UASA'; }
  else if (mk && A.K.find(k=>k.id===mk[1])) { const k = A.K.find(x=>x.id===mk[1]); html = kelas(k); t = k.nama; sub = SN[SB]; }
  else if (mm && A.K.find(k=>k.id===mm[1])?.s.find(v=>v.s.b===+mm[2])) { const k = A.K.find(x=>x.id===mm[1]), v = k.s.find(x=>x.s.b===+mm[2]); html = murid(k,v); t = v.s.n; sub = `${k.nama} · ${SN[SB]}`; navKey = `${SB.toLowerCase()}-k-${k.id}`; }
  else if (V[view] && !['menu','subjek','risiko'].includes(view)) { html = V[view](); t = `${TITLE[view]}`; sub = SN[SB]; }
  else { h = `${SB.toLowerCase()}-utama`; return show(h); }
  cur = h;
  if (subChanged || !side.innerHTML) lukisSisi();
  document.getElementById('view').innerHTML = `<div class="fade">${html}</div>`;
  document.getElementById('cariMob').style.display = view === 'menu' ? '' : 'none';
  document.getElementById('ttl').textContent = t; document.getElementById('sub').textContent = sub;
  document.title = t + ' · Panitia Sepadan';
  side.querySelectorAll('.nv').forEach(b => b.classList.toggle('on', b.dataset.go === navKey));
  const sel = document.getElementById('selSub'); if (sel) sel.value = SB;
  if (location.hash.slice(1) !== h) { try { history.replaceState(null,'','#'+h); } catch(e) {} }
  side.querySelector('.nv.on')?.scrollIntoView({block:'nearest',inline:'center'});
  window.scrollTo(0,0);
};
const step = d => {
  const pm = cur.match(/^pra-m-(\d+)$/);
  if (pm) { const M = PR.murid, i = M.findIndex(x=>x.b===+pm[1]) + d; if (M[i]) show(`pra-m-${M[i].b}`); return; }
  if (cur === 'pra') return;
  const mm = cur.match(/^([a-z]+)-m-(\w\w)-(\d+)$/);
  if (mm) { const k = analisis(SB).K.find(x=>x.id===mm[2]); const i = k.s.findIndex(v=>v.s.b===+mm[3]) + d; if (k.s[i]) show(`${mm[1]}-m-${k.id}-${k.s[i].s.b}`); return; }
  const S = seq(), i = S.indexOf(cur) + d; if (S[i]) show(S[i]);
};
document.getElementById('bKeluar').innerHTML = `${ico('out')}<span>Log keluar</span>`;
document.getElementById('bKeluar').onclick = () => {
  try { ['panitia-pw','panitia-mm-pw'].forEach(k => localStorage.removeItem(k)); sessionStorage.clear(); } catch(e) {}
  document.body.classList.add('kunci'); document.getElementById('view').innerHTML = ''; side.innerHTML = '';
  location.replace(location.pathname + location.search);
};
document.addEventListener('click', e => { const t = e.target.closest('[data-go]'); if (t) show(t.dataset.go); });
document.getElementById('bPrev').onclick = () => step(-1);
document.getElementById('bNext').onclick = () => step(1);
const persembahan = on => { document.body.classList.toggle('present', on);
  try { if (on && !document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{}); else if (!on && document.fullscreenElement) document.exitFullscreen().catch(()=>{}); } catch(e) {} };
document.getElementById('bFull').onclick = () => persembahan(!document.body.classList.contains('present'));
document.getElementById('pKeluar').onclick = () => persembahan(false);
document.getElementById('pPrev').onclick = () => step(-1);
document.getElementById('pNext').onclick = () => step(1);
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) document.body.classList.remove('present'); });
document.getElementById('bCetak').onclick = () => { try { window.print(); } catch(e) {} };
window.addEventListener('beforeprint', () => document.querySelectorAll('details').forEach(d => { d.dataset.w = d.open ? 1 : 0; d.open = true; }));
window.addEventListener('afterprint', () => document.querySelectorAll('details').forEach(d => { d.open = d.dataset.w === '1'; }));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); step(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); step(-1); }
  else if (e.key === 'Home' || e.key === 'm' || e.key === 'M') show('menu');
  else if (e.key === 'f' || e.key === 'F' || e.key === 'p' || e.key === 'P') document.getElementById('bFull').click();
  else if (e.key === 'Escape' && cur.startsWith('pra-m-')) show('pra');
  else if (e.key === 'Escape') { const mm = cur.match(/^([a-z]+)-m-(\w\w)/); if (mm) show(`${mm[1]}-k-${mm[2]}`); }
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== cur) show(h); });
document.body.classList.remove('kunci');
lukisSisi();
show(location.hash.slice(1) || 'menu');
};
/* ---------- pintu masuk: seluruh data disulitkan (AES-256-GCM, PBKDF2-SHA256) ---------- */
const SIMPAN = 'panitia-pw';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const nyahsulit = async pw => {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(ENC.s), iterations:ENC.it, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(ENC.iv)}, key, b64(ENC.ct));
  return JSON.parse(new TextDecoder().decode(pt));
};
const masuk = async (pw, ingat) => { const x = await nyahsulit(pw); if (ingat) { try { localStorage.setItem(SIMPAN, pw); } catch(e) {} } mula(x); };
const err = document.getElementById('err'), btn = document.getElementById('bBuka');
document.getElementById('fMasuk').addEventListener('submit', async e => {
  e.preventDefault(); btn.disabled = true; btn.textContent = 'Membuka…'; err.textContent = '';
  try { await masuk(document.getElementById('pw').value, document.getElementById('ingat').checked); }
  catch(x) { err.textContent = window.crypto?.subtle ? 'Kata laluan salah.' : 'Pelayar ini tidak menyokong penyahsulitan. Buka melalui https.'; btn.disabled = false; btn.textContent = 'Masuk'; console.error(x); }
});
(async () => { let pw = null; try { pw = localStorage.getItem(SIMPAN) || localStorage.getItem('panitia-mm-pw'); } catch(e) {}
  if (pw) { try { await masuk(pw, false); return; } catch(e) { try { localStorage.removeItem(SIMPAN); localStorage.removeItem('panitia-mm-pw'); } catch(x) {} } }
  document.getElementById('pw').focus(); })();
}
